# Repository checks that must pass on every commit: static lint and secret scanning.
#
# This is deliberately separate from turnip_build_combined.yml. That workflow builds
# drivers and publishes releases; it runs on a schedule and on dispatch, takes up to
# 90 minutes per leg, and needs no secrets. These checks are the opposite: seconds
# long, on every push and PR, and they decide whether a commit is acceptable at all.
#
# Keeping them separate means a lint failure is obvious and immediate rather than
# something you discover 40 minutes into a release build.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets you run these checks from another workflow's `workflow_call`.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck python3 python3-yaml git
          # Ubuntu ships meson 1.3; these checks do not need it, but lint.sh warns
          # rather than failing when a tool is absent, so keep the run hermetic.

      - name: Lint
        run: ./scripts/lint.sh

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required. gitleaks scans commit history, and a shallow
          # clone would silently scan almost nothing and report success - the exact
          # false pass this gate exists to prevent.
          fetch-depth: 0

      # Uses the pinned gitleaks binary from our own repo rather than
      # gitleaks/gitleaks-action@v2. That action now REQUIRES a paid
      # GITLEAKS_LICENSE secret and fails the job with
      #   "missing gitleaks license"
      # before it scans anything, which would leave this gate permanently red (or
      # tempt someone into disabling it). The binary is free and the install is
      # checksum-verified in the Dockerfile, so this job has no external account
      # or licence dependency at all.
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          v=8.28.0
          url="https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors "$url" -o /tmp/gl.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gl.tar.gz" \
            | sha256sum -c --strict -
          tar -xzf /tmp/gl.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan every commit for secrets
        # --redact keeps findings out of the log: a scanner that prints the secret
        # into a build log has leaked it a second time. The repo's wrapper
        # summarises rule + file + line from the JSON report, never the value.
        run: ./scripts/scan-secrets.sh history

      - name: Confirm the scanner actually ran
        # Closes the "scanner silently no-op'd" hole: a job that skips or errors
        # must fail loudly rather than pass green.
        run: |
          set -euo pipefail
          command -v gitleaks >/dev/null || {
            echo "::error::gitleaks unavailable - the scan did not run"; exit 1; }
          gitleaks version
          # The repo's .gitleaks.toml must exist and still request the default
          # rule set; an emptied one would make the scan vacuous.
          grep -q 'useDefault = true' .gitleaks.toml || {
            echo "::error::.gitleaks.toml does not use the default rules"; exit 1; }

  # A commit that would break the build scripts themselves: lost executable bits, or
  # the tracked patch fixtures inside turnip_workdir/ disappearing from the index.
  invariants:
    name: repo invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Executable bits and tracked fixtures
        run: |
          set -euo pipefail
          for s in build_turnip.sh build_turnip_perf.sh build_turnip_wayland.sh \
                   build_turnip_linux.sh patches/common/apply_common.sh; do
            mode="$(git ls-files -s "$s" | awk '{print $1}')"
            if [ "$mode" != "100755" ]; then
              echo "::error::$s has mode $mode, expected 100755"
              exit 1
            fi
          done
          echo "executable bits ok"

          for f in turnip_workdir/tu_gen8.patch turnip_workdir/tu_gen8_clean.patch; do
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 || {
              echo "::error::$f is no longer tracked (AGENTS.md section 4: repo content, not build output)"
              exit 1
            }
          done
          echo "tracked build-dir fixtures ok"